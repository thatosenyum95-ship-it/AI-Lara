name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "Deskripsikan aplikasi Android yang ingin dibuat"
        required: true
        type: string
        default: "Buat aplikasi catatan dengan daftar catatan dan penyimpanan lokal"
  push:
    branches: [main]

concurrency:
  group: ai-lara-android-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate Android starter project from prompt
        if: github.event_name == 'workflow_dispatch'
        env:
          AI_LARA_PROMPT: ${{ inputs.prompt }}
        run: python scripts/generate_android_project.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Lara-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
