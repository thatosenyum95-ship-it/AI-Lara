name: Test AI Lara Spec Generator

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run standard-library tests
        run: python -m unittest discover -s tests -v

      - name: Validate training dataset
        run: python training/validate_dataset.py

      - name: Check training script syntax
        run: python -m py_compile training/validate_dataset.py training/train_qlora.py training/evaluate.py
